version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        # AWS_BRANCH and AWS_APP_ID are injected by Amplify Hosting.
        # Do not define them yourself; Amplify rejects env vars with an AWS prefix.
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        # Vite 8 needs Node ^20.19.0 || >=22.12.0. The build image default is not
        # reliably documented, so the version is pinned here.
        - nvm use 24
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    # Vite writes to dist/, not build/.
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
